services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dbt
      POSTGRES_PASSWORD: dbt
      POSTGRES_DB: dbt_demo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbt -d dbt_demo"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5001:5000"
    environment:
      FLASK_DEBUG: "false"

  dbt:
    build:
      context: .
      dockerfile: Dockerfile.dbt
    environment:
      DBT_POSTGRES_HOST: postgres
      DBT_POSTGRES_PORT: "5432"
      DBT_POSTGRES_USER: dbt
      DBT_POSTGRES_PASSWORD: dbt
      DBT_POSTGRES_DB: dbt_demo
    volumes:
      - ./dbt_demo/greenwheel:/app
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - dbt

  prefect-server:
    image: prefecthq/prefect:3-python3.12
    command: prefect server start --host 0.0.0.0
    ports:
      - "4200:4200"
    environment:
      PREFECT_SERVER_API_HOST: 0.0.0.0
    profiles:
      - prefect

  prefect-worker:
    build:
      context: .
      dockerfile: Dockerfile.prefect
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      DBT_POSTGRES_HOST: postgres
      DBT_POSTGRES_PORT: "5432"
      DBT_POSTGRES_USER: dbt
      DBT_POSTGRES_PASSWORD: dbt
      DBT_POSTGRES_DB: dbt_demo
    depends_on:
      postgres:
        condition: service_healthy
      prefect-server:
        condition: service_started
    profiles:
      - prefect

volumes:
  postgres_data:
